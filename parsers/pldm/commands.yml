  0x02: "LID_TEMP"
  0x03: "DUMP"
  0x04: "CERT_SIGNING_REQUEST"
  0x05: "SIGNED_CERT"
  0x06: "ROOT_CERT"
  0x07: "LID_MARKER"
  0x08: "RESOURCE_DUMP_PARMS"
  0x09: "RESOURCE_DUMP"
  0x0A: "PROGRESS_SRC"
  0x0B: "ADJUNCT_DUMP"
  0x0C: "DEVICE_DUMP"
  0x0D: "COD_LICENSE_KEY"
  0x0E: "COD_LICENSED_RESOURCES"
  0x0F: "BMC_DUMP"
  0x10: "SBE_DUMP"
  0x11: "HOSTBOOT_DUMP"
  0x12: "HARDWARE_DUMP"
  0x13: "LID_RUNNING"
  0x14: "PCIE_TOPOLOGY"
  0x15: "CABLE_INFO"
